name: Release package

# Separate from validation.yml: nothing here feeds the required gameplay-tests job.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build-time system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsdl2-2.0-0 libsdl2-ttf-2.0-0 fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build the offline package
        run: python scripts/build_package.py

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trotline-purridise-linux-x86_64
          path: dist/trotline-purridise-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload the v1 save fixture for the migration check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1-save-fixture
          path: fishing/fixtures/save_v2/mid_game.json
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    name: package-smoke
    needs: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A bare Ubuntu image has no Python, which is the point of this job. Paths stay under
    # the workspace: in a container job, runner.temp names the host path, not the mount.
    container: ubuntu:24.04
    # A container job runs `sh -e` by default, which has no pipefail; the image has bash.
    defaults:
      run:
        shell: bash
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Download the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trotline-purridise-linux-x86_64
          path: smoke/package

      - name: Download the v1 save fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v1-save-fixture
          path: smoke/fixture

      - name: Confirm that no Python is installed
        run: |
          if command -v python3 >/dev/null 2>&1; then
            echo "python3 is present in the smoke container" >&2
            exit 1
          fi

      - name: Install the system libraries the bundled SDL2 still needs
        # The bundle carries SDL2, SDL2_ttf and their X11 and audio libraries. These five
        # are not bundled, and the bare image lacks them. Desktops have them already.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libdrm2 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxcb1

      - name: Unpack the package
        run: |
          SMOKE="$GITHUB_WORKSPACE/smoke"
          mkdir -p "$SMOKE/unpacked"
          tar -xzf "$SMOKE/package/trotline-purridise-linux-x86_64.tar.gz" -C "$SMOKE/unpacked"

      - name: Run the packaged self-test
        run: |
          set -o pipefail
          SMOKE="$GITHUB_WORKSPACE/smoke"
          cd "$SMOKE/unpacked/trotline-purridise"
          export HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/xdg-data"
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          ./trotline-purridise --selftest --software 2>&1 | tee "$SMOKE/selftest.log"
          grep -qx 'selftest ok' "$SMOKE/selftest.log"

      - name: Migrate a v1 save on a fresh install
        run: |
          set -o pipefail
          SMOKE="$GITHUB_WORKSPACE/smoke"
          cd "$SMOKE/unpacked/trotline-purridise"
          export HOME="$SMOKE/home" XDG_DATA_HOME="$SMOKE/xdg-data"
          mkdir -p saves
          cp "$SMOKE/fixture/mid_game.json" saves/briar.json
          ./trotline-purridise --check-save 2>&1 | tee "$SMOKE/check-save.txt"
          grep -q ' migrated=yes ' "$SMOKE/check-save.txt"
          # The v1 mid-game save's money and boats carry over (02 §20).
          grep -q ' money=\$734.25 boats=jon,sail ' "$SMOKE/check-save.txt"
          SAVE="$XDG_DATA_HOME/TrotLineSim/TrotlinePurridise/save.json"
          test -s "$SAVE"
          grep -Eq '"version": ?2[^0-9]' "$SAVE"
          BACKUP=$(sed -n 's/.* backup=//p' "$SMOKE/check-save.txt")
          test -s "$BACKUP"
          case "$BACKUP" in "$XDG_DATA_HOME"/*) ;; *) echo "backup is outside the user data folder" >&2; exit 1 ;; esac
          cmp -s "$BACKUP" saves/briar.json

  package-windows:
    name: package-windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Fetch SDL2, SDL2_ttf and DejaVu fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputs = Join-Path $env:RUNNER_TEMP 'release-inputs'
          $sdl = Join-Path $inputs 'sdl'
          $fonts = Join-Path $inputs 'fonts'
          New-Item -ItemType Directory -Force -Path $sdl, $fonts | Out-Null
          $sdlZips = @(
            'https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9-win32-x64.zip',
            'https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0-win32-x64.zip')
          foreach ($url in $sdlZips) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $url -Leaf)
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $sdl -Force
          }
          $dejavu = Join-Path $env:RUNNER_TEMP 'dejavu-fonts-ttf-2.37.zip'
          Invoke-WebRequest -Uri 'https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip' -OutFile $dejavu
          Expand-Archive -Path $dejavu -DestinationPath $fonts -Force

      - name: Build the offline package
        shell: pwsh
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'release-inputs'
          python scripts/build_package.py --sdl-dir (Join-Path $inputs 'sdl') --font-dir (Join-Path $inputs 'fonts')

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trotline-purridise-windows-x86_64
          path: dist/trotline-purridise-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: package-macos
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install SDL2, SDL2_ttf and Python dependencies
        run: |
          brew install sdl2 sdl2_ttf
          python3 -m pip install -r requirements.txt -r requirements-build.txt

      - name: Fetch DejaVu fonts
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dejavu.zip" \
            https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip
          unzip -q "$RUNNER_TEMP/dejavu.zip" -d "$RUNNER_TEMP/fonts"

      - name: Build the offline package
        run: python3 scripts/build_package.py --sdl-dir "$(brew --prefix)/lib" --font-dir "$RUNNER_TEMP/fonts"

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trotline-purridise-macos-arm64
          path: dist/trotline-purridise-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
