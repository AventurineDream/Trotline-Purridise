name: Windows package and tests

# Windows is the de-facto test machine for the offline release: nobody on the
# team owns one. This runs the Windows build and the checks that can run
# headless on every push and pull request, so a Windows break turns the PR red
# instead of waiting for a manual dispatch. package.yml's package-windows job
# only runs on workflow_dispatch and has never run (see
# docs/RELEASE-CHECKLIST.md: "Neither has run yet. Treat them as unverified").
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: windows-tests
    runs-on: windows-latest
    # The suite runs V1-44's pacing report once (test_pacing, about 5 min), so
    # the job takes about 20 min on Linux; Windows is slower.
    timeout-minutes: 45
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch SDL2 and SDL2_ttf
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdl = Join-Path $env:RUNNER_TEMP 'sdl'
          New-Item -ItemType Directory -Force -Path $sdl | Out-Null
          $sdlZips = @(
            'https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9-win32-x64.zip',
            'https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0-win32-x64.zip')
          foreach ($url in $sdlZips) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $url -Leaf)
            Invoke-WebRequest -Uri $url -OutFile $zip
            $stage = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($zip))
            Expand-Archive -Path $zip -DestinationPath $stage -Force
            # The game loads SDL2.dll / SDL2_ttf.dll from beside the game
            # (fishing/platform.py _load), so copy every DLL into the clone
            # root. This includes SDL2_ttf's own dependencies (freetype, png,
            # zlib) that live beside it in its zip.
            Get-ChildItem -Path $stage -Filter *.dll -Recurse | Copy-Item -Destination $PWD -Force
          }

      - name: Verify the tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'HEAD does not match the expected commit' }

      - name: Run unit and persistence regressions
        run: python -m unittest discover -v

      - name: Run narrative persistence regressions
        run: python -m unittest fishing.test_narrative -v

      - name: Run full gameplay and software rendering self-test
        run: python -m fishing --selftest --software

  windows-package:
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        # requirements-build.txt also installs patchelf, which is Linux-only
        # (the build only uses it for the Linux $ORIGIN RUNPATH step), so
        # install just PyInstaller here at the same pinned version.
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Fetch SDL2, SDL2_ttf and DejaVu fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputs = Join-Path $env:RUNNER_TEMP 'release-inputs'
          $sdl = Join-Path $inputs 'sdl'
          $fonts = Join-Path $inputs 'fonts'
          New-Item -ItemType Directory -Force -Path $sdl, $fonts | Out-Null
          $sdlZips = @(
            'https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9-win32-x64.zip',
            'https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0-win32-x64.zip')
          foreach ($url in $sdlZips) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $url -Leaf)
            Invoke-WebRequest -Uri $url -OutFile $zip
            $stage = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($zip))
            Expand-Archive -Path $zip -DestinationPath $stage -Force
            # build_package.py only looks at the top level of --sdl-dir
            # (find_sdl / _find_in do not recurse), and the zips keep their
            # DLLs in a top-level folder, so flatten every DLL into $sdl.
            # Every DLL in that folder is bundled, including SDL2_ttf's own
            # dependencies (freetype, png, zlib).
            Get-ChildItem -Path $stage -Filter *.dll -Recurse | Copy-Item -Destination $sdl -Force
          }
          $dejavu = Join-Path $env:RUNNER_TEMP 'dejavu-fonts-ttf-2.37.zip'
          Invoke-WebRequest -Uri 'https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip' -OutFile $dejavu
          # find_font_file rglobs, so the zip's top-level folder is fine here.
          Expand-Archive -Path $dejavu -DestinationPath $fonts -Force

      - name: Build the offline package
        shell: pwsh
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'release-inputs'
          python scripts/build_package.py --sdl-dir (Join-Path $inputs 'sdl') --font-dir (Join-Path $inputs 'fonts')

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trotline-purridise-windows-x86_64
          path: dist/trotline-purridise-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the v1 save fixture for the migration check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1-save-fixture
          path: fishing/fixtures/save_v2/mid_game.json
          if-no-files-found: error
          retention-days: 14

  windows-package-smoke:
    name: windows-package-smoke
    needs: windows-package
    runs-on: windows-latest
    timeout-minutes: 20
    # A bare Windows image with no Python is not available the way the Linux
    # smoke job uses a bare ubuntu:24.04 container, so this runs on the same
    # hosted runner. The packaged exe is a PyInstaller bundle and never
    # invokes the runner's Python; the self-test and save migration below are
    # the headless launch check on the real bundle.
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Download the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trotline-purridise-windows-x86_64
          path: smoke/package

      - name: Download the v1 save fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v1-save-fixture
          path: smoke/fixture

      - name: Unpack the package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:GITHUB_WORKSPACE 'smoke'
          New-Item -ItemType Directory -Force -Path (Join-Path $smoke 'unpacked') | Out-Null
          Expand-Archive -Path (Join-Path $smoke 'package\trotline-purridise-windows-x86_64.zip') -DestinationPath (Join-Path $smoke 'unpacked') -Force

      - name: Run the packaged self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:GITHUB_WORKSPACE 'smoke'
          $appData = Join-Path $smoke 'appdata'
          New-Item -ItemType Directory -Force -Path $appData | Out-Null
          # SDL_GetPrefPath on Windows resolves %APPDATA%; point it at a
          # fresh folder so the run is a clean install.
          $env:APPDATA = $appData
          Set-Location (Join-Path $smoke 'unpacked\trotline-purridise')
          & .\trotline-purridise.exe --selftest --software 2>&1 | Tee-Object -FilePath (Join-Path $smoke 'selftest.log')
          if (-not (Select-String -Path (Join-Path $smoke 'selftest.log') -Pattern '^selftest ok$' -Quiet)) { throw 'packaged self-test did not print "selftest ok"' }

      - name: Migrate a v1 save on a fresh install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:GITHUB_WORKSPACE 'smoke'
          $appData = Join-Path $smoke 'appdata'
          $env:APPDATA = $appData
          Set-Location (Join-Path $smoke 'unpacked\trotline-purridise')
          New-Item -ItemType Directory -Force -Path saves | Out-Null
          Copy-Item (Join-Path $smoke 'fixture\mid_game.json') -Destination 'saves\briar.json' -Force
          & .\trotline-purridise.exe --check-save 2>&1 | Tee-Object -FilePath (Join-Path $smoke 'check-save.txt')
          $out = Get-Content (Join-Path $smoke 'check-save.txt') -Raw
          if ($out -notmatch ' migrated=yes ') { throw 'save did not migrate' }
          # The v1 mid-game save's money and boats carry over (02 §20).
          if ($out -notmatch ' money=\$734\.25 boats=jon,sail ') { throw 'v1 money/boats did not carry over' }
          # The save path comes from SDL_GetPrefPath, so read it from the
          # --check-save output instead of assuming a fixed location.
          if ($out -notmatch 'save=(\S+)') { throw 'could not read the save path from --check-save output' }
          $save = $Matches[1]
          if (-not (Test-Path $save) -or (Get-Item $save).Length -eq 0) { throw 'migrated save is missing or empty' }
          if (-not (Select-String -Path $save -Pattern '"version": ?2[^0-9]' -Quiet)) { throw 'migrated save is not version 2' }
          if ($out -notmatch ' backup=(\S+)') { throw 'could not read the backup path from --check-save output' }
          $backup = $Matches[1]
          if (-not (Test-Path $backup) -or (Get-Item $backup).Length -eq 0) { throw 'migration backup is missing or empty' }
          # The backup lives in a `backup` folder beside the save (README:
          # "a backup of the original is kept in a `backup` folder beside
          # the new save"; savepaths.backup_directory), not beside the save
          # file itself.
          if ((Split-Path $backup -Parent) -ne (Join-Path (Split-Path $save -Parent) 'backup')) { throw 'backup is not in the backup folder beside the migrated save' }
          if (Compare-Object (Get-Content $backup) (Get-Content 'saves\briar.json')) { throw 'backup differs from the original save' }
