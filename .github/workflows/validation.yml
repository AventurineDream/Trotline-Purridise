name: Game validation

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay-tests:
    name: gameplay-tests
    runs-on: ubuntu-24.04
    # The suite runs V1-44's pacing report once (test_pacing, about 5 min), so the job
    # takes about 20 min.
    timeout-minutes: 25
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsdl2-2.0-0 libsdl2-ttf-2.0-0 fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify the tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run unit and persistence regressions
        run: python -m unittest discover -v

      - name: Run narrative persistence regressions
        run: python -m unittest fishing.test_narrative -v

      - name: Run full gameplay and software rendering self-test
        run: python -m fishing --selftest --software
