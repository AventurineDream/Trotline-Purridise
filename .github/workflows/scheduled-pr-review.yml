name: Scheduled PR Second Review

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled, review_requested]
  workflow_dispatch:

jobs:
  second-review-pass:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Perform second review pass on reviewed open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/second_review.py
